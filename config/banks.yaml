# Banques partenaires
# ===================
#
# Le nom du dossier indique la banque. L'année est ignorée, donc « CNEP 2025 »,
# « cnep_2024 » et « CNEP Banque » désignent la même banque.
#
# Ajouter une banque = ajouter un bloc ici. Aucun code à modifier.

banks:
  - code: CNEP
    label: "CNEP Banque"
    match: ["cnep", "cnep banque"]

  - code: BNPPED
    label: "BNP Paribas El Djazaïr"
    match: ["bnpped", "bnp paribas el djazair", "bnp el djazair", "bnp paribas",
            "bnppb", "bnp"]

# Réglages propres à une banque, appliqués après le traitement général.
overrides: {}
  # Exemple :
  # CNEP:
  #   sheet_preference: ["Ventes", "Feuil1"]   # feuille à privilégier
  #   header_search_rows: 40                   # chercher l'en-tête plus bas
  #   aliases:                                 # intitulés propres à cette banque
  #     "mtt": prime_totale
