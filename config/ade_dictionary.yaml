# Dictionnaire ADE-IMMO : transcription des 120 lignes CHAMP_REF fournies.
# Une cellule vide du dictionnaire ne crée aucune correspondance.
# Les sources sont spécifiques au format : ne pas les convertir en aliases globaux.
# La colonne Avenant positif/Négatif était vide : aucun mapping n'est inventé.
# Les intitulés et types techniques non confirmés restent du texte pour préserver les valeurs.
produits:
- ade_immobilier
formats:
  p_t24:
    pattern: p ade [0-9]{6} t24
    required:
    - num_contrat
    - date_effet
    - prime_totale
  p_d6:
    pattern: p ade [0-9]{6} d6
    required:
    - num_contrat
    - date_effet
    - prime_totale
  c_t24:
    pattern: c ade [0-9]{6} t24
    required:
    - num_contrat
    - date_effet
    - prime_totale
  c_d6:
    pattern: c ade [0-9]{6} d6
    required:
    - num_contrat
    - prime_totale
  p_fit:
    pattern: p ade [0-9]{6} fii?t
    required:
    - num_contrat
    - date_effet
    - prime_totale
  c_fit:
    pattern: c ade [0-9]{6} fii?t
    required:
    - num_contrat
    - date_effet
    - prime_totale
  imp:
    pattern: imp ade immo [0-9]{6}
    required:
    - num_contrat
    - date_effet
    - prime_totale
