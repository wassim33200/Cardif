# Canonical field catalogue.
#
# Each field declares the aliases seen in the wild, an expected content profile used to
# verify a mapping against the actual data, and optionally a derivation rule used when a
# bank does not report the field directly.
#
# `profiles` at the bottom select which fields land in an export. This is where
# "I only want the global premium" is expressed.

fields:

  num_contrat:
    label: "N° contrat"
    type: identifier
    description: "Numéro unique du contrat d'assurance chez la banque."
    aliases:
      - "n contrat"
      - "num contrat"
      - "numero contrat"
      - "numero de contrat"
      - "reference contrat"
      - "ref contrat"
      - "police"
      - "n police"
      - "numero police"
      - "contrat"
    expect:
      mostly: identifier
      min_unique_ratio: 0.8

  nom_client:
    label: "Nom client"
    type: text
    description: "Nom et prénom de l'assuré ou du souscripteur."
    aliases:
      - "nom client"
      - "nom du client"
      - "client"
      - "assure"
      - "nom assure"
      - "nom et prenom"
      - "nom prenom"
      - "souscripteur"
      - "adherent"
    expect:
      mostly: text

  date_effet:
    label: "Date d'effet"
    type: date
    description: "Date de prise d'effet du contrat. Distincte du mois de réception du fichier."
    aliases:
      - "date effet"
      - "date d effet"
      - "date de effet"
      - "effet"
      - "date debut"
      - "date de debut"
      - "date souscription"
      - "date de souscription"
      - "date adhesion"
    expect:
      mostly: date

  date_fin:
    label: "Date de fin"
    type: date
    description: "Date d'échéance ou de fin de couverture."
    aliases:
      - "date fin"
      - "date de fin"
      - "echeance"
      - "date echeance"
      - "fin de garantie"
    expect:
      mostly: date

  produit:
    label: "Produit"
    type: category
    description: "Nom du produit ou de la garantie vendue."
    aliases:
      - "produit"
      - "type produit"
      - "type de produit"
      - "garantie"
      - "type garantie"
      - "formule"
      - "gamme"
      - "libelle produit"
    expect:
      mostly: text
      max_unique_ratio: 0.3

  agence:
    label: "Agence"
    type: category
    description: "Agence bancaire ayant réalisé la vente."
    aliases:
      - "agence"
      - "code agence"
      - "nom agence"
      - "libelle agence"
      - "point de vente"
      - "succursale"
    expect:
      mostly: text
      max_unique_ratio: 0.5

  prime_nette:
    label: "Prime nette"
    type: money
    description: "Prime hors frais et hors taxes. Base de calcul de la prime totale."
    aliases:
      - "prime nette"
      - "prime de base"
      - "prime base"
      - "prime hors frais"
      - "prime ht"
      - "montant prime nette"
    expect:
      mostly: numeric
      min_value: 0

  frais:
    label: "Frais"
    type: money
    description: "Frais de dossier, chargements ou accessoires ajoutés à la prime nette."
    aliases:
      - "frais"
      - "frais de dossier"
      - "frais dossier"
      - "chargement"
      - "chargements"
      - "accessoire"
      - "accessoires"
      - "cout police"
    expect:
      mostly: numeric
      min_value: 0

  prime_totale:
    label: "Prime totale"
    type: money
    description: "Prime globale effectivement payée par le client, frais inclus."
    aliases:
      - "prime totale"
      - "prime globale"
      - "prime ttc"
      - "total prime"
      - "montant prime"
      - "montant total"
      - "prime"
      - "montant global"
      - "mtt global"
    expect:
      mostly: numeric
      min_value: 0
    derive:
      - rule: sum
        from: [prime_nette, frais]

  capital_assure:
    label: "Capital assuré"
    type: money
    description: "Capital garanti par le contrat."
    aliases:
      - "capital assure"
      - "capital"
      - "montant assure"
      - "capital garanti"
      - "somme assuree"
      - "montant credit"
    expect:
      mostly: numeric
      min_value: 0

  duree:
    label: "Durée"
    type: integer
    description: "Durée du contrat, en mois ou en années selon la banque."
    aliases:
      - "duree"
      - "duree contrat"
      - "duree en mois"
      - "duree mois"
      - "nb mois"
      - "periode"
    expect:
      mostly: numeric
      min_value: 0
      max_value: 600

# Fields injected by the pipeline itself, never mapped from a sheet.
derived_fields:
  banque:        { label: "Banque",           type: category }
  mois_reception: { label: "Mois réception",  type: period }
  annee_reception: { label: "Année réception", type: integer }

profiles:

  # Full detail: keeps the premium breakdown where banks provide it.
  detaille:
    columns: [banque, mois_reception, num_contrat, nom_client, date_effet, produit,
              agence, prime_nette, frais, prime_totale, capital_assure, duree]
    required: [num_contrat, date_effet, prime_totale]

  # Global premium only. The breakdown is collapsed away; banks that report
  # nette + frais have prime_totale derived by the sum rule above.
  powerbi_2025:
    columns: [banque, mois_reception, num_contrat, nom_client, date_effet, produit,
              agence, prime_totale, capital_assure]
    required: [num_contrat, date_effet, prime_totale]
